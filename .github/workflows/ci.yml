name: Flock CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Check Go fixes
        if: runner.os != 'Windows'
        run: |
          go fix ./...
          git diff --exit-code
      - name: Test all packages
        if: runner.os != 'Windows'
        run: go test ./...
      - name: Test portable Flock runtime
        if: runner.os == 'Windows'
        # Test the shipped minimal build and portable primitives. The retained
        # legacy text/ZIP/UI modes are covered by the full Unix suites.
        run: go test -tags croc_no_tailcat ./internal/flockcli ./src/codephrase ./src/receivefs ./src/comm ./src/tcp ./src/message ./src/pakekey ./src/redact ./src/crypt ./src/compress
      - name: Build installed command
        run: go build -tags croc_no_tailcat ./
      - name: Verify Flock version
        run: go run -tags croc_no_tailcat . --version
      - name: Race-test agent and transport paths
        if: runner.os != 'Windows'
        run: go test -race ./internal/flockcli ./src/codephrase ./src/croc -run 'Flock|Agent|Invitation|ReceiveDeadline|ReceiveVerifier'
      - name: Test minimal release build
        env:
          CGO_ENABLED: "0"
        run: go test -tags croc_no_tailcat ./internal/flockcli ./src/croc -run 'Flock|Agent|Invitation|ReceiveDeadline|ReceiveVerifier'
