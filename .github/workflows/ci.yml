name: Flock CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Check Go fixes
        run: |
          go fix ./...
          git diff --exit-code
      - name: Test
        run: go test ./...
      - name: Build installed command
        run: go build ./
      - name: Verify Flock version
        run: go run . --version
      - name: Race-test agent and transport paths
        if: runner.os == 'Linux'
        run: go test -race ./internal/flockcli ./src/codephrase ./src/croc -run 'Flock|Agent|Invitation|ReceiveDeadline'
      - name: Test minimal release build
        run: go test -tags croc_no_tailcat ./internal/flockcli ./src/croc -run 'Flock|Agent|Invitation|ReceiveDeadline'
